[workspace]
resolver = "2"
members = ["crates/api", "crates/cli"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4", default-features = false }
api = { path = "crates/api" }
